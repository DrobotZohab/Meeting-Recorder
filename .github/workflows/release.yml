name: Release

# Push a tag like v1.0.0 (or click "Run workflow") to build the
# Windows installer and Mac app and attach them to a GitHub Release.
# Runs by itself whenever the version in package.json changes on main,
# or by hand from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
    paths: [package.json]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
            files: |
              dist/*.exe
              dist/*.exe.blockmap
              dist/latest.yml
          - os: macos-latest
            target: --mac --arm64
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # Each build only produces its installer. Publishing happens once, below,
      # so the two builds never race to create the same release.
      - name: Build
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Meetings ${{ steps.v.outputs.version }}
          make_latest: true
          files: installers/*
          body: |
            **Windows:** download the `.exe` and run it. If SmartScreen appears, click More info > Run anyway.
            **Mac (Apple Silicon):** download the `.dmg`. First launch: System Settings > Privacy & Security > Open Anyway.
